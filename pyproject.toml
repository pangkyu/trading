[project]
name = "trading"
version = "0.1.0"
description = "NH PLUG Open API automated trading bot + paper-trading web service, on a shared core"
requires-python = ">=3.11"
dependencies = [
    # milestone 1 (core) has zero runtime deps beyond stdlib.
]

[project.optional-dependencies]
# milestone 2+: real NH connectivity
nh = [
    "nhplug[instruments]>=0.3",
]
# milestone 3: gateway (persistence is stdlib sqlite3)
gateway = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "httpx>=0.27",           # TestClient
]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["core", "gateway"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# 시장 개장일은 로컬(KST) 기준이라 tz-naive date 를 의도적으로 쓴다.
ignore = ["DTZ005", "DTZ011"]
